server {
    listen 80;
    server_name _;

    # Project attachments (#72) can be up to 25 MB; allow headroom for the multipart overhead.
    # Without this, nginx's default of 1 MB rejects uploads with a 413 before Django sees them.
    # The 25 MB limit itself is enforced by Django (validate_attachment_file_size).
    client_max_body_size 30m;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /static/ {
        alias /staticfiles/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
