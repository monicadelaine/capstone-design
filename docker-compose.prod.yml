services:
  db:
    image: postgres:17
    restart: unless-stopped
    env_file:
      - .env.production.db
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      DATABASE: postgres
      SQL_HOST: db
      SQL_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - django_static:/usr/src/app/staticfiles

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_AUTH0_DOMAIN: ${VITE_AUTH0_DOMAIN}
        VITE_AUTH0_CLIENT_ID: ${VITE_AUTH0_CLIENT_ID}
        VITE_AUTH0_AUDIENCE: ${VITE_AUTH0_AUDIENCE}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - django_static:/staticfiles:ro

volumes:
  postgres_prod_data:
  django_static:
