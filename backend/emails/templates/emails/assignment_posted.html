<!DOCTYPE html>
<html lang="en">
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; padding: 20px;">
    <div style="background-color: #f9f9f9; padding: 30px; border-radius: 8px;">
        <p>Hello {{ student_name }},</p>

        <p>Your UA CS Capstone project assignment for {{ semester }} has been posted.</p>

        <p><strong>Your project: {{ project_name }}</strong></p>

        <p>Sign in to see the project details and your teammates:</p>
        <p><a href="{{ assignment_url }}" style="display: inline-block; background-color: #9e1b32; color: white; padding: 12px 24px; text-decoration: none; border-radius: 4px;">View my assignment</a></p>
        <p style="font-size: 14px; color: #666;">Or open this link: {{ assignment_url }}</p>

        <p style="margin-top: 30px; padding-top: 20px; border-top: 1px solid #ddd; font-size: 14px; color: #666;">
            Best regards,<br>
            UA CS Capstone Team
        </p>
    </div>
</body>
</html>
